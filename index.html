<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poésie d'Halloween</title>
<style>
:root{--bg:#0a0a0a;--card:#161616;--ink:#ffb347;--muted:#ff9a3c;--orange:#ff7a00;--green:#5fd38d;--red:#ff4d4d;--line:#3a2410;--field:#000000}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{color:var(--orange);text-align:center;margin:.2em 0;font-size:clamp(26px,6vw,38px)}
.sub{text-align:center;color:var(--muted);margin:0 0 8px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;border:2px solid var(--line)}
textarea{width:100%;min-height:240px;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--field);color:var(--ink)}
button,select{font:inherit;font-size:16px;cursor:pointer;border:none;border-radius:999px;padding:8px 16px;background:var(--orange);color:#2a1300;font-weight:bold;margin:4px}
select{background:var(--field);color:var(--ink);border:2px solid var(--line)}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.tabs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.tabs button{background:var(--line);color:var(--ink);margin:2px}
.tabs button.on{background:var(--orange);color:#2a1300}
.tip{color:var(--muted);margin-top:0}
.info{font-weight:bold;color:var(--orange)}
.poem{font-size:20px;margin:10px 0}
.poem .v{margin:6px 0;min-height:1.5em}
.poem .gap{height:16px}
.click{cursor:pointer;border-radius:8px;padding:0 4px}
.click:hover{background:var(--line)}
.shown{color:var(--orange)}
.hid{border-bottom:2px dashed var(--muted);color:transparent;cursor:pointer;border-radius:4px;background:rgba(255,255,255,.06)}
.hid.peek{color:var(--orange)}
input.blank{font:inherit;font-size:18px;background:var(--field);color:var(--ink);border:none;border-bottom:2px solid var(--orange);padding:0 2px;text-align:center;border-radius:4px 4px 0 0;max-width:100%}
input.ok{border-color:var(--green);color:var(--green)}
input.ko{border-color:var(--red);color:var(--red)}
.chip{display:block;width:100%;text-align:left;background:var(--line);color:var(--ink);border-radius:12px;font-weight:normal;margin:6px 0;padding:10px 14px}
.chip.right{background:var(--green);color:#0d2a18}
.chip.wrong{background:var(--red);color:#2a0d0d}
.okline{color:var(--green)}
.done{border-left:4px solid var(--green);padding-left:10px;min-height:10px}
.prompt{font-size:22px;background:var(--field);border-radius:12px;padding:12px;margin:10px 0;border-left:5px solid var(--orange)}
.hidebar{height:1.2em;background:var(--line);border-radius:8px;width:85%}
.big{font-size:24px;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎃 Ma poésie d'Halloween 🦇</h1>
  <p class="sub">Des jeux pour l'apprendre par cœur</p>

  <div class="card" id="setup">
    <p><b>1.</b> Colle ou recopie ta poésie ci-dessous : <b>un vers par ligne</b>, et <b>une ligne vide</b> entre les strophes.</p>
    <textarea id="txt" placeholder="Colle ici le texte de ta poésie…"></textarea>
    <p style="text-align:center"><button id="go">C'est parti ! 👻</button></p>
  </div>

  <div id="play" class="hidden">
    <div class="tabs" id="tabs"></div>
    <div class="card" id="game"></div>
    <p style="text-align:center"><button class="ghost" id="edit">✏️ Modifier le texte</button></p>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’`]/g,"'").trim();}
function tok(line){return line.match(/[\p{L}\p{N}]+(?:['’-][\p{L}\p{N}]+)*|[^\p{L}\p{N}]+/gu)||[];}
const isWord=t=>/[\p{L}\p{N}]/u.test(t);
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.9;speechSynthesis.speak(u);}catch(e){}}

let L=[];let hidden=new Set();
function parse(txt){
  const raw=txt.replace(/\r/g,'').split('\n').map(s=>s.trim());
  L=[];let st=0,prevEmpty=true;
  raw.forEach(s=>{if(!s){if(!prevEmpty)st++;prevEmpty=true;return;}L.push({t:s,s:st,toks:tok(s)});prevEmpty=false;});
}
const nbSt=()=>L.length?L[L.length-1].s+1:0;
function poemBox(build){
  const box=el('div','poem');
  L.forEach((o,i)=>{if(i>0&&o.s!==L[i-1].s)box.append(el('div','gap'));const v=build(o,i);v.classList.add('v');box.append(v);});
  return box;
}
function bar(...items){const b=el('div');items.forEach(x=>b.append(x));return b;}

const games={
  lire:{n:'📖 Lire',f(g){
    g.append(el('p','tip','Lis la poésie plusieurs fois à voix haute. Clique sur un vers pour l\'écouter 🔊'));
    g.append(poemBox(o=>{const d=el('div','click',o.t);d.onclick=()=>say(o.t);return d;}));
    const b=el('button',null,'🔊 Écouter toute la poésie');b.onclick=()=>say(L.map(o=>o.t).join('. '));
    const s=el('button','ghost','⏹ Stop');s.onclick=()=>{try{speechSynthesis.cancel()}catch(e){}};
    g.append(bar(b,s));
  }},
  caches:{n:'🦇 Mots cachés',f(g){
    g.append(el('p','tip','Clique sur « Cacher des mots », puis récite la poésie. Si tu bloques, clique sur un trou pour voir le mot.'));
    const b1=el('button',null,'🦇 Cacher des mots');const b2=el('button','ghost','Tout montrer');
    const info=el('p','info');const holder=el('div');g.append(bar(b1,b2),info,holder);
    const all=[];L.forEach((o,i)=>o.toks.forEach((t,j)=>{if(isWord(t))all.push(i+'-'+j);}));
    function draw(){
      holder.innerHTML='';
      holder.append(poemBox((o,i)=>{const d=el('div');o.toks.forEach((t,j)=>{if(hidden.has(i+'-'+j)){const s=el('span','hid',t);s.onclick=()=>s.classList.toggle('peek');d.append(s);}else d.append(document.createTextNode(t));});return d;}));
      info.textContent=`Mots cachés : ${hidden.size} / ${all.length}`+(hidden.size===all.length?' — Tout est caché ! Si tu sais la réciter, tu la connais 🎉':'');
      b1.disabled=hidden.size===all.length;
    }
    b1.onclick=()=>{const rest=all.filter(k=>!hidden.has(k));shuffle(rest).slice(0,Math.max(1,Math.ceil(all.length*.15))).forEach(k=>hidden.add(k));draw();};
    b2.onclick=()=>{hidden.clear();draw();};
    draw();
  }},
  trous:{n:'✍️ Texte à trous',f(g){
    g.append(el('p','tip','Écris les mots qui manquent (touche Entrée pour passer au suivant), puis clique sur « Vérifier ».'));
    const sel=el('select');[['Facile',6],['Moyen',3],['Difficile',2],['Expert : tous les mots',1]].forEach(([n,v])=>sel.append(new Option(n,v)));
    const bn=el('button','ghost','🔄 Nouveaux trous');
    const holder=el('div');const bv=el('button',null,'✅ Vérifier');const bs=el('button','ghost','👀 Solution');const res=el('p','info');
    g.append(bar(sel,bn),holder,bar(bv,bs),res);
    let inputs=[];
    function draw(){
      holder.innerHTML='';inputs=[];res.textContent='';const n=+sel.value;
      holder.append(poemBox(o=>{
        const d=el('div');const words=o.toks.map((t,j)=>isWord(t)?j:-1).filter(j=>j>=0);
        const pick=new Set(words.filter(()=>Math.random()<1/n));
        if(!pick.size&&words.length)pick.add(words[Math.floor(Math.random()*words.length)]);
        o.toks.forEach((t,j)=>{
          if(pick.has(j)){const inp=el('input','blank');inp.style.width=(t.length+1.5)+'ch';inp.dataset.a=t;inp.autocomplete='off';inp.setAttribute('autocapitalize','off');inp.spellcheck=false;inputs.push(inp);d.append(inp);}
          else d.append(document.createTextNode(t));
        });return d;
      }));
      inputs.forEach((inp,k)=>inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();(inputs[k+1]||bv).focus();}});
    }
    bv.onclick=()=>{let ok=0;inputs.forEach(i=>{const good=norm(i.value)===norm(i.dataset.a);i.classList.toggle('ok',good);i.classList.toggle('ko',!good);if(good)ok++;});
      res.textContent=`${ok} / ${inputs.length} bonnes réponses `+(ok===inputs.length?'🎉 Bravo !':'— corrige les mots en rouge 💪');};
    bs.onclick=()=>inputs.forEach(i=>{if(norm(i.value)!==norm(i.dataset.a)){i.value=i.dataset.a;i.classList.remove('ok');i.classList.add('ko');}});
    sel.onchange=draw;bn.onclick=draw;draw();
  }},
  lettres:{n:'🔤 Premières lettres',f(g){
    g.append(el('p','tip','Chaque mot est remplacé par sa première lettre. Récite le vers, puis clique dessus pour vérifier.'));
    const holder=el('div');const r=el('button','ghost','🙈 Tout recacher');g.append(holder,r);
    function draw(){holder.innerHTML='';holder.append(poemBox(o=>{
      const short=o.toks.map(t=>isWord(t)?t[0]:t).join('');const d=el('div','click',short);
      d.onclick=()=>{const s=d.textContent===short;d.textContent=s?o.t:short;d.classList.toggle('shown',s);};return d;}));}
    r.onclick=draw;draw();
  }},
  ordre:{n:'🧩 Dans l\'ordre',f(g){
    g.append(el('p','tip','Les vers sont mélangés ! Clique dessus dans le bon ordre.'));
    const sel=el('select');sel.append(new Option('Toute la poésie','all'));for(let s=0;s<nbSt();s++)sel.append(new Option('Strophe '+(s+1),s));
    const bn=el('button','ghost','🔄 Recommencer');const holder=el('div');g.append(bar(sel,bn),holder);
    function draw(){
      holder.innerHTML='';const set=L.filter(o=>sel.value==='all'||o.s===+sel.value).map(o=>o.t);let k=0,err=0;
      const done=el('div','poem done');const msg=el('p','info');const pool=el('div');holder.append(done,msg,pool);
      shuffle(set).forEach(t=>{const b=el('button','chip',t);b.onclick=()=>{
        if(t===set[k]){k++;b.remove();done.append(el('div','v okline',t));if(k===set.length)msg.textContent=`🎉 Bravo ! ${err} erreur${err>1?'s':''}.`;}
        else{err++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}
      };pool.append(b);});
    }
    sel.onchange=draw;bn.onclick=draw;draw();
  }},
  suite:{n:'➡️ Vers suivant',f(g){
    g.append(el('p','tip','Lis le vers et choisis celui qui vient juste après.'));
    const holder=el('div');g.append(holder);let i=0,score=0;
    function q(){
      holder.innerHTML='';
      if(L.length<2){holder.append(el('p',null,'Il faut au moins deux vers pour ce jeu.'));return;}
      if(i>=L.length-1){holder.append(el('p','big',`🎃 Terminé ! Score : ${score} / ${L.length-1}`));const r=el('button',null,'Rejouer');r.onclick=()=>{i=0;score=0;q();};holder.append(bar(r));return;}
      holder.append(el('p','info',`Question ${i+1} / ${L.length-1} — Score : ${score}`));
      holder.append(el('div','prompt',L[i].t));
      const good=L[i+1].t;const others=shuffle([...new Set(L.map(o=>o.t).filter(t=>t!==good))]).slice(0,2);
      const box=el('div');let answered=false;
      shuffle([good,...others]).forEach(t=>{const b=el('button','chip',t);b.onclick=()=>{
        if(answered)return;answered=true;
        if(t===good){score++;b.classList.add('right');}else{b.classList.add('wrong');[...box.children].forEach(c=>{if(c.textContent===good)c.classList.add('right');});}
        setTimeout(()=>{i++;q();},t===good?700:1800);
      };box.append(b);});
      holder.append(box);
    }
    q();
  }},
  reciter:{n:'🎤 Réciter',f(g){
    g.append(el('p','tip','Récite la poésie de mémoire, sans regarder. Clique sur « Vers suivant » pour vérifier au fur et à mesure.'));
    let n=0;const b=el('button',null,'👀 Vers suivant');const r=el('button','ghost','🔄 Recommencer');const holder=el('div');
    g.append(bar(b,r),holder);
    function draw(){holder.innerHTML='';holder.append(poemBox((o,i)=>i<n?el('div',null,o.t):el('div','hidebar')));b.disabled=n>=L.length;
      if(n>=L.length)holder.append(el('p','big','🎉 Bravo, tu as récité toute la poésie !'));}
    b.onclick=()=>{n++;draw();};r.onclick=()=>{n=0;draw();};draw();
  }}
};

let current='lire';
function show(k){current=k;[...$('#tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.k===k));const g=$('#game');g.innerHTML='';games[k].f(g);}
Object.entries(games).forEach(([k,v])=>{const b=el('button',null,v.n);b.dataset.k=k;b.onclick=()=>show(k);$('#tabs').append(b);});

function start(){
  parse($('#txt').value);
  if(L.length<2){alert('Colle d\'abord ta poésie (au moins deux vers) 🙂');return;}
  store('poesie-halloween',$('#txt').value);hidden.clear();
  $('#setup').classList.add('hidden');$('#play').classList.remove('hidden');show('lire');window.scrollTo(0,0);
}
$('#go').onclick=start;
$('#edit').onclick=()=>{$('#play').classList.add('hidden');$('#setup').classList.remove('hidden');};
const saved=load('poesie-halloween');if(saved)$('#txt').value=saved;
</script>
</body>
</html>
